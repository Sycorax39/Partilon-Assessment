# ComCo Customer Service Integration Platform
#
#   docker compose up --build
#
# Only the API gateway is published to the host. Backends, databases and agents live on
# the internal network and can be reached only through API management.

name: comco-platform

# Every Python component sends traces to Jaeger (OpenTelemetry, OTLP over HTTP).
x-tracing-env: &tracing-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_BSP_SCHEDULE_DELAY: "1000"     # export spans every second (default 5 s) so traces show up quickly

x-python-service: &python-service
  restart: unless-stopped
  networks: [internal]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  # ---------- API management ----------
  gateway:
    image: kong:3.9
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"   # Prometheus metrics at /metrics
      KONG_PROXY_ACCESS_LOG: "off"         # replaced by the richer JSON file-log plugin (kong.yml)
      KONG_TRACING_INSTRUMENTATIONS: request,router,balancer,plugin_access   # spans for the opentelemetry plugin
      KONG_TRACING_SAMPLING_RATE: "1.0"    # trace every request (demo); production would sample
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"             # public API entry point
      - "127.0.0.1:8001:8001"   # Kong Admin API — localhost only, for inspection
      - "127.0.0.1:8100:8100"   # Kong status/metrics — localhost only
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    depends_on:
      customer-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      coordinator-agent: { condition: service_healthy }

  # ---------- Customer domain ----------
  customer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_pw}
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  customer-service:
    <<: *python-service
    build:
      context: .                                   # repo root, so the shared libs/common is available
      dockerfile: services/customer-service/Dockerfile
    environment:
      <<: *tracing-env
      DATABASE_URL: postgresql://${CUSTOMER_DB_USER:-customer}:${CUSTOMER_DB_PASSWORD:-customer_pw}@customer-db:5432/customers
    depends_on:
      customer-db: { condition: service_healthy }

  # ---------- Order domain ----------
  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDER_DB_USER:-order}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pw}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  order-service:
    <<: *python-service
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *tracing-env
      DATABASE_URL: postgresql://${ORDER_DB_USER:-order}:${ORDER_DB_PASSWORD:-order_pw}@order-db:5432/orders
    depends_on:
      order-db: { condition: service_healthy }

  # ---------- Agents ----------
  # Agents are internal: no published ports, no gateway route. They talk to each other with
  # A2A over the internal network, and call the business APIs THROUGH THE GATEWAY.
  coordinator-agent:
    <<: *python-service
    build:
      context: .
      dockerfile: agents/coordinator/Dockerfile
    environment:
      <<: *tracing-env
      # Addresses only. WHAT each agent can do is discovered from its Agent Card at startup.
      AGENT_URLS: http://customer-agent:8000,http://order-agent:8000
      AGENT_URL: http://coordinator-agent:8000/   # advertised in the coordinator's own Agent Card
      A2A_TIMEOUT_SECONDS: "10"                   # per delegated task
      QUERY_TIMEOUT_SECONDS: "12"                 # whole query (gateway allows 15 s)
    depends_on:
      customer-agent: { condition: service_healthy }
      order-agent: { condition: service_healthy }

  customer-agent:
    <<: *python-service
    build:
      context: .
      dockerfile: agents/customer-agent/Dockerfile
    environment:
      <<: *tracing-env
      AGENT_URL: http://customer-agent:8000/   # advertised in its Agent Card
      GATEWAY_URL: http://gateway:8000         # agents call backend APIs through the gateway
      GATEWAY_API_KEY: ${CUSTOMER_AGENT_API_KEY:-customer-agent-key}   # its own identity at the gateway
      API_TIMEOUT_SECONDS: "5"                 # per API call (the gateway gives up on the backend at 4 s)
      SKILL_TIMEOUT_SECONDS: "8"               # whole task deadline
      API_RETRY_ATTEMPTS: "2"                  # 1 retry, only for connection errors / 502 / 503
      CIRCUIT_FAILURE_THRESHOLD: "3"           # consecutive failures before the circuit opens
      CIRCUIT_RESET_SECONDS: "15"              # how long calls are paused before a trial call

  order-agent:
    <<: *python-service
    build:
      context: .
      dockerfile: agents/order-agent/Dockerfile
    environment:
      <<: *tracing-env
      AGENT_URL: http://order-agent:8000/
      GATEWAY_URL: http://gateway:8000
      GATEWAY_API_KEY: ${ORDER_AGENT_API_KEY:-order-agent-key}
      API_TIMEOUT_SECONDS: "5"
      SKILL_TIMEOUT_SECONDS: "8"
      API_RETRY_ATTEMPTS: "2"
      CIRCUIT_FAILURE_THRESHOLD: "3"
      CIRCUIT_RESET_SECONDS: "15"

  # ---------- Observability ----------
  jaeger:
    image: jaegertracing/jaeger:2.21.0     # all-in-one: OTLP receiver + in-memory storage + UI
    restart: unless-stopped
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0          # accept spans from the other containers
    ports:
      - "127.0.0.1:16686:16686"            # Jaeger UI -> http://localhost:16686
    networks: [internal]

networks:
  internal:

volumes:
  customer-db-data:
  order-db-data:
